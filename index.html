<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>HI MATRIX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #007bff;
            font-size: 40px;
            margin-bottom: 20px;
        }
        .info-box {
            text-align: right;
            background: #e9ecef;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-top: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <script>
        let password = prompt("أدخل كلمة المرور:");
        if (password === "habibahabiba") {
            // الموقع غيتحل عادي
        } else {
            alert("كلمة المرور غير صحيحة!");
            location.reload();
        }
    </script>

    <div class="container">
        <h1>HI MATRIX</h1>
        
        <div class="info-box">
            <h3>معلوماتي الشخصية وملاحظاتي:</h3>
            <p>هنا تقدر تكتب وتعدل أي حاجة بغيتي، وغير تكليكي على حفظ غتبقى مبدلة عندك في الموقع ديما:</p>
            
            <textarea id="userText" placeholder="اكتب معلوماتك هنا..."></textarea>
            <br>
            <button onclick="saveData()">حفظ المعلومات</button>
        </div>
    </div>

    <script>
        // تحميل المعلومات القديمة إيلا كانت محفوظة
        window.onload = function() {
            let savedText = localStorage.getItem('matrixInfo');
            if (savedText) {
                document.getElementById('userText').value = savedText;
            }
        };

        // حفظ المعلومات الجديدة
        function saveData() {
            let text = document.getElementById('userText').value;
            localStorage.setItem('matrixInfo', text);
            alert("تم حفظ المعلومات بنجاح في موقعك!");
        }
    </script>

</body>
</html>
